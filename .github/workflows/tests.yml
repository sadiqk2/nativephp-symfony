name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.suite }} — ${{ matrix.deps }} on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [bundle, mobile-bundle]
        deps: [locked, highest, lowest]
        include:
          # The lock resolves Symfony 8, which needs PHP 8.4.1, so this is the only
          # combination the committed lock can be installed on.
          - { deps: locked, php: '8.4' }
          # The declared ceiling on the oldest PHP: a fresh resolve, which on 8.3 is
          # the Symfony 7 line.
          - { deps: highest, php: '8.3' }
          # And the declared *floor*, which is the leg that earns its place. Every
          # constraint in composer.json is a promise, and until this ran the promise
          # was false in three places: symfony/filesystem changed `Path::isAbsolute()`
          # and `Path::join()` under us, symfony/routing's UrlMatcher did not take the
          # method from the request before 7.4, and one test used an assertion PHPUnit
          # only added in 11.5.
          - { deps: lowest, php: '8.3' }
    steps:
      - uses: actions/checkout@v5

      # Runs unprivileged, unlike a container job: the tests that assert an unwritable
      # file is an error can only be provoked as a normal user, and root skips them.
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: zip
          coverage: none

      # The contract tests read the real runtime sources: without these clones their
      # data providers yield nothing and the suite silently shrinks by ~115 tests.
      - name: Clone the upstream runtimes the contract tests read
        run: |
          git clone --depth 1 https://github.com/NativePHP/desktop upstream/np-desktop
          git clone --depth 1 https://github.com/NativePHP/mobile-air upstream/np-mobile

      - name: Install dependencies (${{ matrix.deps }})
        working-directory: ${{ matrix.suite }}
        run: |
          case '${{ matrix.deps }}' in
            locked)  composer install --no-interaction --no-progress ;;
            highest) composer update  --no-interaction --no-progress ;;
            lowest)  composer update --prefer-lowest --prefer-stable --no-interaction --no-progress ;;
          esac

      # --fail-on-skipped: a skip here means the environment lost coverage, not that a
      # test was irrelevant. Both suites run with zero skips on an unprivileged runner.
      #
      # Deprecations are not failed on: the floor pins Symfony 7.0 and PHPUnit 11.5,
      # whose own signatures raise ~220 implicitly-nullable notices on PHP 8.3+. They
      # are those packages' to fix, and failing on them would mean abandoning the floor
      # rather than testing it.
      - name: Tests
        working-directory: ${{ matrix.suite }}
        run: php vendor/bin/phpunit --no-coverage --fail-on-skipped

  # Both packages are published to Packagist, so the manifests are part of the product
  # rather than build scaffolding. --strict fails on the warnings Packagist would
  # otherwise surface after the fact — a stale lock hash, a missing description, a
  # `version` field that should be a tag.
  package:
    name: package manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [bundle, mobile-bundle]
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2.37.2
        with:
          php-version: '8.4'
          extensions: zip
          coverage: none

      - name: Validate composer.json
        working-directory: ${{ matrix.suite }}
        run: composer validate --strict --no-interaction

      # A dist archive that carries the test suite is a download every consumer pays
      # for and nobody unpacks. .gitattributes is the only thing keeping it out, and
      # nothing else would notice if a path in it stopped matching.
      #
      # `HEAD:<suite>` rather than `HEAD`, because that is the tree the split mirror
      # publishes: the package directory *as* the repository root, which is also what
      # makes the anchored `/tests` patterns in its .gitattributes match.
      - name: Check export-ignore keeps the tests out of the dist archive
        run: |
          git archive --format=tar "HEAD:${{ matrix.suite }}" > /tmp/dist.tar
          if tar -tf /tmp/dist.tar | grep -qE '^(tests/|phpunit\.xml\.dist|\.github/)'; then
            echo '::error::The dist archive still carries development files:'
            tar -tf /tmp/dist.tar | grep -E '^(tests/|phpunit\.xml\.dist|\.github/)'
            exit 1
          fi
          echo "Dist archive: $(tar -tf /tmp/dist.tar | wc -l) paths, $(stat -c%s /tmp/dist.tar) bytes"

      # src/Testing/ and FakeBridge are shipped API — an application's own test suite
      # is the only thing that can exercise a runtime that does not exist off a device.
      # Excluding them would be the easy mistake to make in the step above.
      - name: Check the testing kit is still shipped
        run: |
          case '${{ matrix.suite }}' in
            bundle)        want='src/Testing/FakeRuntime.php' ;;
            mobile-bundle) want='src/Bridge/FakeBridge.php'   ;;
          esac
          tar -tf /tmp/dist.tar | grep -qx "$want" || {
            echo "::error::$want is missing from the dist archive — consumers cannot test against the fake."
            exit 1
          }
