name: split

# Packagist reads a composer.json at a repository *root*, so a monorepo holding two
# packages cannot be published as it stands. This mirrors each package directory into
# its own repository, history and all, and those mirrors are what Packagist watches.
#
# The mirrors are read-only. Nothing is ever pushed to them by hand, and neither an issue
# nor a pull request opened against one can be acted on — each package carries its own
# .github/ISSUE_TEMPLATE/config.yml and .github/pull_request_template.md saying so, which
# is why those files exist in a directory GitHub ignores here. An ISSUE_TEMPLATE config is
# only ever shown on the New Issue page, so the pull-request half needs its own file.
#
# Requires a secret, SPLIT_TOKEN: a fine-grained personal access token with Contents:
# write on both mirror repositories. The default GITHUB_TOKEN is scoped to this
# repository alone and cannot push across, which is the one thing an Action cannot
# grant itself.
#
# Without that secret the split still runs and the push is skipped, so a repository that
# has not been through RELEASING.md's one-time setup keeps a green default branch — but
# a tag push or a manual run fails outright instead. See "Is publishing configured?".

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Splits are pushes to a shared branch on another repository. Two runs for the *same*
  # ref racing would interleave, and the loser would be rejected as non-fast-forward — so
  # they queue, and `cancel-in-progress: false` keeps the running one alive.
  #
  # Keyed on the ref, not on one global group, because GitHub allows exactly one *pending*
  # run per group and cancels the previously pending one whenever another is queued. A
  # release is `git push origin main` immediately followed by `git push origin v0.1.0`:
  # under one shared group the tag run is the pending one, and the next push to main —
  # a README fix, a changelog tidy — would cancel it silently. The mirror would then never
  # receive the tag, Packagist would never see the version, and nothing would say so.
  group: split-${{ github.ref }}
  cancel-in-progress: false

jobs:
  split:
    name: ${{ matrix.package }} → ${{ matrix.mirror }}
    runs-on: ubuntu-latest
    if: github.repository == 'sadiqk2/nativephp-symfony'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: bundle
            mirror: nativephp-symfony-desktop-bundle
          - package: mobile-bundle
            mirror: nativephp-symfony-mobile-bundle

    steps:
      # The whole history: `git subtree split` rewrites every commit that touched the
      # prefix, so a shallow clone would produce a mirror whose history begins at an
      # arbitrary point and whose commit shas change on the next run.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # A missing token is fatal on a tag and on a manual run, and a skip on a routine
      # push to a branch. The asymmetry is the point. A release that silently fails to
      # reach Packagist is the worst thing this workflow can do, and a manual run that
      # quietly does nothing is the second worst — both have to fail. But a push to main
      # before the mirrors exist is just the state this repository is in until
      # RELEASING.md's one-time setup has been done, and failing every one of those
      # would paint the default branch red for a condition nobody has reached yet.
      #
      # An *expired* token is not this case and stays loud: the secret is still set, the
      # push gets a 403, the job fails. Only deleting the secret outright is quiet, which
      # is why the skip writes a run-summary entry rather than only a log line.
      #
      # Computed in a step because the `secrets` context cannot be read from an `if:`.
      - name: Is publishing configured?
        id: guard
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
        run: |
          if [ -n "$SPLIT_TOKEN" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'configured=false' >> "$GITHUB_OUTPUT"

          if [ "${GITHUB_REF_TYPE}" = 'tag' ] || [ "${GITHUB_EVENT_NAME}" = 'workflow_dispatch' ]; then
            echo "::error::SPLIT_TOKEN is not set, so ${GITHUB_REF_NAME} cannot reach" \
                 "${{ matrix.mirror }}. The default GITHUB_TOKEN is scoped to this repository" \
                 "and cannot push across. See RELEASING.md — one-time setup."
            exit 1
          fi

          echo "::notice::SPLIT_TOKEN is not set, so nothing was mirrored — expected until RELEASING.md's one-time setup is done."
          {
            echo '### Not mirrored'
            echo
            echo 'There is no `SPLIT_TOKEN` secret, so `${{ matrix.package }}/` was split but not'
            echo 'pushed to `${{ matrix.mirror }}`. That is the expected state until the one-time'
            echo 'setup in [RELEASING.md](https://github.com/${{ github.repository }}/blob/main/RELEASING.md#one-time-setup)'
            echo 'has been done — create the two mirror repositories, then add the token.'
            echo
            echo 'A tag push or a manual run fails instead of skipping, because a release that'
            echo 'silently never reaches Packagist is worse than a red tick.'
          } >> "$GITHUB_STEP_SUMMARY"

      # Run even with no token: it costs a second, and it is the only thing that proves
      # the split itself works before anyone has wired the publishing up.
      - name: Split ${{ matrix.package }}/
        id: split
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          sha="$(git subtree split --prefix=${{ matrix.package }} HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Split ${{ matrix.package }}/ to $sha"

      # A tag push and a branch push are different jobs on purpose. A tag is what
      # Packagist turns into a release, so it has to land on the mirror pointing at the
      # split commit rather than at this repository's commit, which the mirror has never
      # seen. Pushing main as well keeps `dev-main` resolvable between releases.
      - name: Push to the mirror
        if: steps.guard.outputs.configured == 'true'
        env:
          SPLIT_TOKEN: ${{ secrets.SPLIT_TOKEN }}
          MIRROR: https://x-access-token:${{ secrets.SPLIT_TOKEN }}@github.com/${{ github.repository_owner }}/${{ matrix.mirror }}.git
          SHA: ${{ steps.split.outputs.sha }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = 'tag' ]; then
            echo "Tagging ${GITHUB_REF_NAME} at ${SHA} on ${{ matrix.mirror }}"
            git tag -f "${GITHUB_REF_NAME}" "${SHA}"
            git push "${MIRROR}" "refs/tags/${GITHUB_REF_NAME}"
          elif [ "${GITHUB_REF_NAME}" = 'main' ]; then
            echo "Pushing ${SHA} to ${{ matrix.mirror }} main"
            git push "${MIRROR}" "${SHA}:refs/heads/main"
          else
            # workflow_dispatch takes a ref, and the branch picker defaults to whatever
            # the person last looked at. Without this, running it from a feature branch
            # publishes that branch's tree as the mirror's main — which Packagist then
            # serves as dev-main to anyone tracking it. A non-fast-forward would be
            # rejected, but a branch cut from main is a fast-forward, so the accident is
            # exactly the plausible one.
            echo "::notice::Ref is ${GITHUB_REF_NAME}, not main or a tag — split to ${SHA}, nothing pushed."
          fi
